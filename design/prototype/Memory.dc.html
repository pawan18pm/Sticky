<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#C8371B}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F3EF; color: #14201B; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="height: 340px; position: relative; background: #E9B9A8; flex: none">
    <svg width="390" height="340" viewBox="0 0 390 340" aria-hidden="true" style="position: absolute; inset: 0">
      <circle cx="300" cy="90" r="34" fill="#F6E1D6"></circle>
      <path d="M0 250 L80 170 L150 230 L220 150 L300 220 L390 160 L390 340 L0 340 Z" fill="#C98E7C"></path>
      <path d="M0 290 C80 270 160 300 240 280 C300 266 350 280 390 270 L390 340 L0 340 Z" fill="#A86E5D"></path>
      <circle cx="60" cy="120" r="26" fill="#F3CFC2"></circle><circle cx="92" cy="104" r="20" fill="#F3CFC2"></circle><circle cx="340" cy="210" r="22" fill="#F3CFC2"></circle>
    </svg>
    <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between">
      <a href="MapHome.dc.html" aria-label="Back to map" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <div style="display: flex; gap: 10px">
        <button type="button" aria-label="Edit memory" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
        <a href="Resurface.dc.html" aria-label="Share memory" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></a>
      </div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; gap: 6px" aria-label="Photo 1 of 18">
      <div style="width: 18px; height: 6px; border-radius: 3px; background: #FFFFFF"></div>
      <div style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.6)"></div>
      <div style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.6)"></div>
      <div style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.6)"></div>
    </div>
  </div>

  <div style="flex: 1; margin-top: -22px; background: #F1F3EF; border-radius: 24px 24px 0 0; padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 16px; position: relative">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; color: #A12C15; letter-spacing: 0.4px; text-transform: uppercase">Day 3 · Sat 6 Apr 2024</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: -0.5px">Philosopher's Path</h1>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #4E5B54">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
        Sakyō-ku, Kyoto · 18 photos
      </div>
    </div>

    <p style="margin: 0; font-size: 15px; line-height: 1.55">Petals everywhere. We walked the whole canal twice because Maya refused to leave before the light went gold.</p>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FBE3DC; color: #8A2612; font-size: 13px; font-weight: 600; display: flex; align-items: center">Peaceful</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px">
        <span style="width: 20px; height: 20px; border-radius: 50%; background: #9CC5A1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">M</span>with Maya</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center">Sunny, 19°</span>
    </div>

    <button type="button" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 16px; background: #FFFFFF; border: 0; cursor: pointer; color: #14201B; text-align: left">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #14201B; display: flex; align-items: center; justify-content: center; flex: none">
        <sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg></sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></sc-if>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 600">Voice note</span>
        <span style="font-size: 12px; color: #4E5B54">{{voiceLabel}}</span>
      </span>
      <svg width="96" height="24" viewBox="0 0 96 24" aria-hidden="true"><path d="M2 12v0M10 8v8M18 4v16M26 9v6M34 6v12M42 2v20M50 8v8M58 5v14M66 10v4M74 7v10M82 9v6M90 11v2" stroke="#C8371B" stroke-width="3" stroke-linecap="round"></path></svg>
    </button>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <div style="aspect-ratio: 1; border-radius: 12px; background: #F3CFC2"></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #D9A090"></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #C4B8A8"></div>
      <div style="aspect-ratio: 1; border-radius: 12px; background: #14201B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">+14</div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #DDE2DD; padding-top: 14px">
      <span style="font-size: 13px; color: #4E5B54">Part of <a href="Trips.dc.html" style="font-weight: 600">Kyoto, Apr 2024</a></span>
      <span style="font-size: 13px; color: #4E5B54">3 of 6 places</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { playing: false }; }
  renderVals() {
    const p = this.state.playing;
    return {
      playing: p,
      paused: !p,
      voiceLabel: p ? 'Playing · 0:12 / 0:48' : '0:48 · recorded on the path',
      toggle: () => this.setState({ playing: !p })
    };
  }
}
</script>
</body>
</html>
