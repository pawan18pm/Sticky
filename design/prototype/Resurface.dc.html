<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On this day and share</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#C8371B}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F3EF; color: #14201B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="MapHome.dc.html" aria-label="Back to map" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">From your map</span>
    <div style="width: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 600; color: #A12C15; letter-spacing: 0.4px; text-transform: uppercase">This week, 4 years ago</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: -0.5px">Your first solo trip</h1>
  </div>

  <div style="display: flex; justify-content: center">
    <div style="{{cardStyle}}">
      <div style="flex: 1; border-radius: 6px; background: #9CC5A1; position: relative; overflow: hidden">
        <svg width="100%" height="100%" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0">
          <circle cx="230" cy="50" r="22" fill="#E2F0DF"></circle>
          <path d="M0 120 C60 100 120 130 180 110 C230 95 270 110 300 100 L300 200 L0 200Z" fill="#7FAF86"></path>
          <path d="M0 150 C60 135 130 160 200 140 C250 128 280 140 300 135 L300 200 L0 200Z" fill="#5E9467"></path>
          <path d="M0 175 C70 165 140 185 210 170 C255 160 285 170 300 166" stroke="#E2F0DF" stroke-width="2" fill="none"></path>
        </svg>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 2px 4px 0">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">Ubud, Bali</span>
          <span style="font-size: 12px; color: #4E5B54">Rice terraces at dawn · Dec 2022</span>
        </div>
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #C8371B; border: 3px solid #FBE3DC"></div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; font-weight: 600; color: #4E5B54">Share as</span>
    <div role="group" aria-label="Share format" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E2E6E2">
      <sc-for list="{{formats}}" as="f" hint-placeholder-count="3">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #4E5B54; line-height: 1.4">{{formatHint}}</span>
  </div>

  <div style="flex: 1"></div>
  <div style="display: flex; gap: 10px">
    <a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; border: 1px solid #C9CFCA; background: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Copy link</a>
    <a href="#" style="flex: 1.4; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #14201B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Share {{shareLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fmt: 'Postcard' }; }
  renderVals() {
    const info = {
      'Postcard': { h: 290, w: 340, hint: 'A printable-style card with the place, date and your note.', share: 'postcard' },
      'Story': { h: 400, w: 225, hint: 'Vertical 9:16 for Instagram or WhatsApp status.', share: 'story' },
      'Trip map': { h: 290, w: 340, hint: 'A private link to the whole Bali trip — friends see pins and photos, not your other trips.', share: 'trip map' }
    };
    const cur = info[this.state.fmt];
    const formats = Object.keys(info).map((label) => {
      const on = label === this.state.fmt;
      return {
        label, on,
        pick: () => this.setState({ fmt: label }),
        style: 'height: 40px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #14201B; box-shadow: 0 2px 6px rgba(20,32,27,0.12)' : 'background: transparent; color: #4E5B54')
      };
    });
    return {
      formats,
      formatHint: cur.hint,
      shareLabel: cur.share,
      cardStyle: 'width: ' + cur.w + 'px; height: ' + cur.h + 'px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px; transform: rotate(-1.5deg); box-shadow: 0 14px 30px rgba(20,32,27,0.14)'
    };
  }
}
</script>
</body>
</html>
