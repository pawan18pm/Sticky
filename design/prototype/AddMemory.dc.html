<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a memory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#C8371B}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F3EF; color: #14201B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="MapHome.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">New memory</span>
    <div style="width: 44px"></div>
  </div>

  <div style="display: flex; gap: 8px">
    <div style="width: 84px; height: 104px; border-radius: 14px; background: #E9B9A8; position: relative">
      <span style="position: absolute; left: 6px; top: 6px; height: 20px; padding: 0 7px; border-radius: 10px; background: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center">Cover</span></div>
    <div style="width: 84px; height: 104px; border-radius: 14px; background: #D9A090"></div>
    <div style="width: 84px; height: 104px; border-radius: 14px; background: #C4B8A8"></div>
    <button type="button" aria-label="Add more photos" style="width: 84px; height: 104px; border-radius: 14px; border: 2px dashed #9AA39D; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4E5B54" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="background: #FFFFFF; border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: center">
    <div style="width: 56px; height: 56px; border-radius: 12px; background: #CFE0E6; position: relative; overflow: hidden; flex: none">
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><path d="M0 30 C14 20 28 36 56 22 L56 56 L0 56Z" fill="#E4E7D8"></path><circle cx="28" cy="30" r="6" fill="#C8371B" stroke="#FFFFFF" stroke-width="2.5"></circle></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; color: #2D6577">Found in photo details</span>
      <span style="font-size: 15px; font-weight: 600">Fushimi Inari, Kyoto</span>
      <span style="font-size: 13px; color: #4E5B54">Sun 7 Apr 2024 · 6:42 am</span>
    </div>
    <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9CFCA; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer; color: #14201B">Change</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="mtitle" style="font-size: 13px; font-weight: 600; color: #4E5B54">Title</label>
    <input id="mtitle" type="text" value="Sunrise through the torii gates" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D5DAD5; background: #FFFFFF; font-size: 15px; color: #14201B; outline: none">
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="mnote" style="font-size: 13px; font-weight: 600; color: #4E5B54">What do you want to remember?</label>
    <textarea id="mnote" rows="3" placeholder="The smell, the sound, who you were with…" style="padding: 12px 14px; border-radius: 14px; border: 1px solid #D5DAD5; background: #FFFFFF; font-size: 15px; line-height: 1.45; resize: none; color: #14201B; outline: none"></textarea>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #4E5B54">Mood</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 10px">
    <button type="button" style="flex: 1; height: 46px; border-radius: 14px; border: 1px solid #C9CFCA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; color: #14201B">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8371B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Voice note</button>
    <button type="button" style="flex: 1; height: 46px; border-radius: 14px; border: 1px solid #C9CFCA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; color: #14201B">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D6577" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.5"></circle><path d="M3 19c1-3 3.3-4.5 6-4.5s5 1.5 6 4.5M17 8v6M14 11h6"></path></svg>Tag people</button>
  </div>

  <div style="flex: 1"></div>
  <a href="Memory.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #14201B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px">Pin to map</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mood: 'Awe' }; }
  renderVals() {
    const moods = ['Awe', 'Peaceful', 'Adventurous', 'Romantic', 'Funny'].map((label) => {
      const on = label === this.state.mood;
      return {
        label, on,
        pick: () => this.setState({ mood: label }),
        style: 'height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #FBE3DC; color: #8A2612; border: 1px solid #C8371B' : 'background: #FFFFFF; color: #14201B; border: 1px solid #D5DAD5')
      };
    });
    return { moods };
  }
}
</script>
</body>
</html>
