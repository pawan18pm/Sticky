<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#C8371B}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #CFE0E6; color: #14201B; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <svg width="390" height="640" viewBox="0 0 390 640" aria-hidden="true" style="position: absolute; left: 0; top: 110px">
    <path d="M30 92 C36 82 58 80 66 90 C70 98 58 106 44 104 C34 103 26 99 30 92Z" fill="#E4E7D8" stroke="#CBD2BC"></path>
    <path d="M70 200 C66 170 90 150 110 150 C112 120 120 80 140 60 C160 50 170 80 165 110 C190 100 220 70 270 60 C305 52 330 70 322 105 C316 135 300 160 298 190 C296 220 300 250 288 280 C278 300 268 320 255 312 C245 330 235 350 222 335 C210 310 195 280 175 268 C150 262 140 240 120 235 C100 232 80 225 70 200Z" fill="#E4E7D8" stroke="#CBD2BC"></path>
    <path d="M80 255 C110 245 150 260 175 275 C190 300 200 320 190 350 C180 400 170 450 150 490 C135 520 115 520 105 490 C95 450 95 410 85 380 C70 350 55 320 60 290 C62 270 70 260 80 255Z" fill="#E4E7D8" stroke="#CBD2BC"></path>
    <path d="M330 180 C338 170 348 172 345 185 C342 200 335 215 325 225 C318 230 314 222 320 212 C326 202 326 190 330 180Z" fill="#E4E7D8" stroke="#CBD2BC"></path>
    <path d="M290 350 C305 340 325 345 328 362 C326 378 305 380 295 372 C286 365 284 356 290 350Z" fill="#E4E7D8" stroke="#CBD2BC"></path>
    <path d="M250 395 C265 388 285 392 295 400 C285 408 262 408 250 395Z" fill="#E4E7D8" stroke="#CBD2BC"></path>
    <path d="M305 410 C318 405 335 408 342 414 C330 420 315 420 305 410Z" fill="#E4E7D8" stroke="#CBD2BC"></path>
    <path d="M300 470 C330 455 380 460 400 480 L400 560 C370 575 330 570 305 550 C290 530 285 490 300 470Z" fill="#E4E7D8" stroke="#CBD2BC"></path>
    <path d="M150 130 C180 120 210 140 240 125 M180 190 C210 180 240 200 270 185 M110 330 C130 320 150 340 170 330 M120 410 C135 400 150 420 165 410" stroke="#D3D8C3" stroke-width="1.5" fill="none"></path>
  </svg>

  <sc-for list="{{pins}}" as="pin" hint-placeholder-count="4">
    <button type="button" onClick="{{pin.pick}}" aria-label="{{pin.label}}" style="{{pin.style}}">
      <span style="position: absolute; right: -6px; top: -6px; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #14201B; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{pin.count}}</span>
    </button>
  </sc-for>

  <div style="position: absolute; left: 16px; right: 16px; top: 56px; display: flex; flex-direction: column; gap: 10px">
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(20,32,27,0.1)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E5B54" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search memories</span>
      <input type="search" placeholder="Search places, people, moments" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 15px; background: transparent; color: #14201B">
    </label>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
        <button type="button" onClick="{{chip.pick}}" style="{{chip.style}}">{{chip.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 100px; background: #FFFFFF; border-radius: 22px; padding: 12px; display: flex; gap: 14px; align-items: center; box-shadow: 0 10px 30px rgba(20,32,27,0.18)">
    <div style="width: 84px; height: 84px; border-radius: 14px; background: {{sel.color}}; flex: none"></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <span style="font-size: 12px; font-weight: 600; color: #A12C15; letter-spacing: 0.4px; text-transform: uppercase">{{sel.date}}</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px">{{sel.place}}</span>
      <span style="font-size: 13px; color: #4E5B54; line-height: 1.4">{{sel.line}}</span>
    </div>
    <a href="Memory.dc.html" aria-label="Open memory" style="width: 44px; height: 44px; border-radius: 50%; background: #14201B; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #F1F3EF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding-bottom: 14px; box-sizing: border-box; border-top: 1px solid #DDE2DD">
    <a href="MapHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: #14201B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</a>
    <a href="Trips.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; color: #4E5B54">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"></rect><path d="M9 7V4h6v3"></path></svg>Trips</a>
    <a href="AddMemory.dc.html" aria-label="Add memory" style="justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: #C8371B; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(200,55,27,0.35)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Resurface.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; color: #4E5B54">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>On this day</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; color: #4E5B54">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'kyoto', chip: 'All' };
  }
  renderVals() {
    const data = [
      { id: 'iceland', x: 48, y: 202, color: '#A9C4CF', count: 11, year: '2023', place: 'Ring Road, Iceland', date: 'Jun 2023 · 9 days', line: 'Midnight sun at Jökulsárlón with Maya.' },
      { id: 'lisbon', x: 82, y: 308, color: '#F2CF8A', count: 4, year: '2023', place: 'Lisbon, Portugal', date: 'Sep 2023 · 5 days', line: 'Tram 28, pastéis and a rooftop sunset.' },
      { id: 'kyoto', x: 334, y: 310, color: '#E9B9A8', count: 6, year: '2024', place: 'Kyoto, Japan', date: 'Apr 2024 · 7 days', line: 'Cherry blossoms on the Philosopher’s Path.' },
      { id: 'bali', x: 322, y: 523, color: '#9CC5A1', count: 3, year: '2022', place: 'Ubud, Bali', date: 'Dec 2022 · 6 days', line: 'Rice terraces at dawn, first solo trip.' }
    ];
    const chipNames = ['All', '2024', '2023', '2022'];
    const visible = data.filter((d) => this.state.chip === 'All' || d.year === this.state.chip);
    const pins = visible.map((d) => {
      const on = d.id === this.state.sel;
      const size = on ? 60 : 46;
      return {
        label: 'Show ' + d.place,
        count: d.count,
        pick: () => this.setState({ sel: d.id }),
        style: 'position: absolute; left: ' + (d.x - size / 2) + 'px; top: ' + (d.y - size / 2) + 'px; width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; background: ' + d.color + '; border: 3px solid #FFFFFF; padding: 0; cursor: pointer; box-shadow: ' + (on ? '0 0 0 6px rgba(200,55,27,0.3), ' : '') + '0 6px 14px rgba(20,32,27,0.25)'
      };
    });
    const chips = chipNames.map((c) => {
      const on = c === this.state.chip;
      return {
        label: c,
        pick: () => {
          const first = data.find((d) => c === 'All' || d.year === c);
          this.setState({ chip: c, sel: first ? first.id : this.state.sel });
        },
        style: 'height: 36px; padding: 0 14px; border-radius: 18px; border: 0; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #14201B; color: #FFFFFF' : 'background: #FFFFFF; color: #14201B; box-shadow: 0 2px 8px rgba(20,32,27,0.08)')
      };
    });
    const sel = data.find((d) => d.id === this.state.sel) || data[2];
    return { pins, chips, sel };
  }
}
</script>
</body>
</html>
