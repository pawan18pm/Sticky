<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto-import trips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#C8371B}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F3EF; color: #14201B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 60px 24px 36px; gap: 22px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Permissions.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; gap: 6px" aria-label="Step 2 of 3">
      <div style="width: 6px; height: 6px; border-radius: 3px; background: #BFC6C0"></div>
      <div style="width: 22px; height: 6px; border-radius: 3px; background: #14201B"></div>
      <div style="width: 6px; height: 6px; border-radius: 3px; background: #BFC6C0"></div>
    </div>
    <div style="width: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -0.6px">We found {{selectedCount}} trips</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4E5B54">Grouped by date and distance from home. Untick anything you'd rather keep off the map.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #4E5B54">
      <span>Scanned 2,418 photos</span><span>Done</span>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #DDE2DD"><div style="height: 6px; border-radius: 3px; background: #C8371B; width: 100%"></div></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{trips}}" as="trip" hint-placeholder-count="4">
      <button type="button" onClick="{{trip.toggle}}" aria-pressed="{{trip.on}}" style="display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border-radius: 16px; background: #FFFFFF; border: 0; text-align: left; cursor: pointer; color: #14201B">
        <div style="width: 52px; height: 52px; border-radius: 12px; background: {{trip.color}}; flex: none"></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font-weight: 600; font-size: 16px">{{trip.place}}</span>
          <span style="font-size: 13px; color: #4E5B54">{{trip.meta}}</span>
        </div>
        <sc-if value="{{trip.on}}" hint-placeholder-val="{{true}}">
          <div style="width: 26px; height: 26px; border-radius: 8px; background: #14201B; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          </div>
        </sc-if>
        <sc-if value="{{trip.off}}" hint-placeholder-val="{{false}}">
          <div style="width: 22px; height: 22px; border-radius: 8px; border: 2px solid #9AA39D"></div>
        </sc-if>
      </button>
    </sc-for>
    <div style="display: flex; gap: 10px; align-items: center; padding: 6px 4px 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5B54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      <span style="font-size: 13px; color: #4E5B54">Photos taken near home are skipped. <a href="#" style="font-weight: 600">Set home</a></span>
    </div>
  </div>

  <div style="flex: 1"></div>
  <a href="MapReady.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #14201B; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px">Pin {{selectedCount}} trips to my map</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: {} };
  }
  renderVals() {
    const base = [
      { id: 'kyoto', place: 'Kyoto, Japan', meta: 'Apr 2024 · 142 photos · 6 places', color: '#E9B9A8' },
      { id: 'lisbon', place: 'Lisbon, Portugal', meta: 'Sep 2023 · 88 photos · 4 places', color: '#F2CF8A' },
      { id: 'iceland', place: 'Ring Road, Iceland', meta: 'Jun 2023 · 203 photos · 11 places', color: '#A9C4CF' },
      { id: 'bali', place: 'Ubud, Bali', meta: 'Dec 2022 · 64 photos · 3 places', color: '#9CC5A1' }
    ];
    const off = this.state.off;
    const trips = base.map((t) => ({
      ...t,
      on: !off[t.id],
      off: !!off[t.id],
      toggle: () => this.setState({ off: { ...off, [t.id]: !off[t.id] } })
    }));
    return { trips, selectedCount: trips.filter((t) => t.on).length };
  }
}
</script>
</body>
</html>
